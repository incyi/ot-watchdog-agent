version: '3.8'

services:
  # OT Watchdog Agent
  ot-watchdog-agent:
    build: .
    environment:
      # WordPress configuration
      WORDPRESS_URL: http://wordpress
      OT_WATCHDOG_API_KEY: change-me-in-production
      
      # Device configuration (JSON format)
      OT_DEVICES: |
        {
          "PLC-Main": "8.8.8.8",
          "HMI-Panel": "1.1.1.1",
          "Network-Switch": "192.168.1.1",
          "Modem": "8.8.4.4"
        }
      
      # Agent configuration
      CHECK_INTERVAL: "30"
      LOG_LEVEL: "INFO"
    restart: unless-stopped
    networks:
      - default

volumes:
  db_data:

networks:
  default:
    driver: bridge
